name: doc_manager
description: "Gestionnaire de documents personnels local"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # DB locale
  sqflite: ^2.4.2
  path: ^1.9.1

  # Export des dossiers en ZIP
  archive: ^4.0.9

  # Chemins système de fichiers
  path_provider: ^2.1.5

  # Import de fichiers
  file_picker: ^10.1.9

  # Partage
  share_plus: ^11.0.0

  # Visionneuse PDF
  flutter_pdfview: ^1.3.2

  # Scanner
  camera: ^0.12.0+2

  # Génération PDF
  pdf: ^3.11.3

  # Traitement images
  image: ^4.3.0

  # Gestion des permissions
  permission_handler: ^12.0.0+1

  # Icônes Material
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.13.1
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - logo/playstore_icon.png
